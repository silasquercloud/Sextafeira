<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sexta Feira</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

    <header>
        <div class="logo">S</div>

        <div>
            <h1>Sexta Feira</h1>
            <span>Assistente de IA</span>
        </div>
    </header>


    <main id="chat">

        <div class="welcome">

            <div class="big-logo">S</div>

            <h2>Olá 👋</h2>

            <p>
                Eu sou a Sexta Feira.
                Como posso ajudar?
            </p>

        </div>

    </main>


    <footer>

        <div class="input-area">

            <textarea
                id="message"
                placeholder="Mensagem para Sexta Feira..."
                rows="1"></textarea>

            <button id="send">
                ➤
            </button>

        </div>

        <p class="notice">
            Sexta Feira pode cometer erros. Verifique informações importantes.
        </p>

    </footer>

</div>

<script src="/app.js"></script>

</body>
</html>
